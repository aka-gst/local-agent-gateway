[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "local-agent-gateway"
version = "0.2.0"
description = "Loopback-only gateway for a local Ollama backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "allure-pytest>=2.15,<3",
  "pytest>=8,<9",
  "pytest-cov>=6,<7",
  "pytest-playwright>=0.7,<1",
]

[project.scripts]
local-agent-gateway = "local_agent_gateway.main:run"
local-agent-eval = "local_agent_gateway.evaluation:main"
local-agent-live-eval = "local_agent_gateway.live_evaluation:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_agent_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
markers = [
  "api: API contract and security tests",
  "e2e: browser end-to-end tests",
  "llm_eval: deterministic LLM response quality tests",
]
