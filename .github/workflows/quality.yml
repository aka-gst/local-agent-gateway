name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

# Per-ref, so pushing a tag no longer cancels an in-flight main deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install project and test dependencies
        run: uv sync --extra test
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Run API, unit, and browser tests
        run: >-
          uv run pytest
          --cov=local_agent_gateway
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-fail-under=90
          --alluredir=allure-results
      - name: Run deterministic LLM evaluations
        run: uv run local-agent-eval evaluations/golden_responses.json
      - name: Validate Docker Compose
        env:
          GATEWAY_BEARER_TOKEN: test-token-at-least-sixteen-characters
          GATEWAY_ALLOWED_MODELS: local-test-model
        run: docker compose config --quiet
      - name: Build gateway container
        run: docker build --tag local-agent-gateway:test .
      - name: Restore published QA metrics history
        if: always()
        run: |
          curl --fail --silent --show-error --location \
            "https://aka-gst.github.io/local-agent-gateway/qa-metrics-history.json" \
            --output previous-qa-metrics-history.json || true
      - name: Build machine-readable QA metrics report
        if: always()
        run: >-
          uv run local-agent-qa-metrics
          --coverage-threshold 90
          --commit "${{ github.sha }}"
          --branch "${{ github.ref_name }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --previous-history previous-qa-metrics-history.json
      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: warn
      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qa-reports
          path: test-results
          if-no-files-found: warn
      - name: Set up Java for Allure
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Node.js for Allure
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Restore Allure history
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p allure-results/history
          for file in history.json history-trend.json duration-trend.json retry-trend.json categories-trend.json; do
            curl --fail --silent --show-error --location \
              "https://aka-gst.github.io/local-agent-gateway/history/$file" \
              --output "allure-results/history/$file" || true
          done
      - name: Generate Allure HTML report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx --yes allure-commandline@2.36.0 generate allure-results --clean -o allure-report
      - name: Publish QA metrics next to the Allure report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp test-results/qa-metrics.json test-results/qa-metrics-history.json allure-report/
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    # GitHub Pages allows one deployment at a time; queue instead of cancelling.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Allure report
        id: deployment
        uses: actions/deploy-pages@v5
