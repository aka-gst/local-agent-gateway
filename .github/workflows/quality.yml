name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install project and test dependencies
        run: uv sync --extra test
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Run API, unit, and browser tests
        run: uv run pytest --cov=local_agent_gateway --cov-report=term-missing --alluredir=allure-results
      - name: Run deterministic LLM evaluations
        run: uv run local-agent-eval evaluations/golden_responses.json
      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: warn
      - name: Upload LLM evaluation report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: llm-evaluation
          path: test-results
          if-no-files-found: warn
      - name: Set up Java for Allure
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Node.js for Allure
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Generate Allure HTML report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx --yes allure-commandline@2.36.0 generate allure-results --clean -o allure-report
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Allure report
        id: deployment
        uses: actions/deploy-pages@v4
