name: Quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install project and test dependencies
        run: uv sync --extra test
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Run API, unit, and browser tests
        run: uv run pytest --cov=local_agent_gateway --cov-report=term-missing --alluredir=allure-results
      - name: Run deterministic LLM evaluations
        run: uv run local-agent-eval evaluations/golden_responses.json
      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: warn
      - name: Upload LLM evaluation report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: llm-evaluation
          path: test-results
          if-no-files-found: warn
